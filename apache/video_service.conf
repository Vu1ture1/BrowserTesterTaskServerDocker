<VirtualHost *:80>
    ServerName localhost

    RedirectMatch 404 "^/media/.*\.part$"
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    WSGIDaemonProcess video_service user=www-data group=www-data processes=2 threads=15 home=/app python-path=/app display-name=%{GROUP}
    
    WSGIScriptAlias / /app/web_service.wsgi process-group=video_service application-group=%{GLOBAL}
    <Directory /app>
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    LimitRequestBody 0

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
